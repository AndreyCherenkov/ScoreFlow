spring:
  application:
    name: "ScoreFlow"
  datasource:
    url: jdbc:postgresql://localhost:5432/scoring_db
    username: postgres
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: smtp.mail.ru
    port: 587
    username: ${SMTP_EMAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  security:
    jwt: ${JWT_SECRET}

#inner validation, logs, etc...
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false